<div class="row g-3 mb-4">
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm bg-primary text-white h-100 overflow-hidden position-relative">
            <div class="card-body p-3 z-index-2">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-uppercase small mb-1 opacity-75 fw-bold" style="font-size: 0.65rem;">Sorties aujourd'hui</h6>
                        <h3 class="fw-bold mb-0 h4">{{ stats.out_today }}</h3>
                    </div>
                    <i class="fas fa-calendar-day fs-1 opacity-25"></i>
                </div>
            </div>
            <div class="position-absolute end-0 bottom-0 opacity-10 mb-n2 me-n2">
                <i class="fas fa-calendar-day fa-4x"></i>
            </div>
        </div>
    </div>

    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm bg-info text-white h-100 overflow-hidden position-relative">
            <div class="card-body p-3 z-index-2">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-uppercase small mb-1 opacity-75 fw-bold" style="font-size: 0.65rem;">Sorties cette semaine</h6>
                        <h3 class="fw-bold mb-0 h4">{{ stats.out_week }}</h3>
                    </div>
                    <i class="fas fa-calendar-week fs-1 opacity-25"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm bg-dark text-white h-100 overflow-hidden position-relative">
            <div class="card-body p-3 z-index-2">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-uppercase small mb-1 opacity-75 fw-bold" style="font-size: 0.65rem;">Sorties ce mois</h6>
                        <h3 class="fw-bold mb-0 h4">{{ stats.out_month }}</h3>
                    </div>
                    <i class="fas fa-chart-line fs-1 opacity-25"></i>
                </div>
            </div>
        </div>
    </div>
</div>

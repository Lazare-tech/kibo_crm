{% load humanize %}
<div class="row g-2"> {% for produit in produits %}
    <div class="col-6 col-md-3">
        <div class="card maxit-card h-100 position-relative shadow-sm border-0">
            {% if produit.categorie %}
            <span class="category-badge-overlay" style="font-size: 0.6rem; padding: 2px 6px;">{{ produit.categorie.nom|upper }}</span>
            {% endif %}
            
            <img src="{% if produit.image %}{{ produit.image.url }}{% else %}https://via.placeholder.com/300/eef4ff/00235B?text={{ produit.nom|truncatechars:10 }}{% endif %}" 
                 class="card-img p-1 rounded-4" style="height: 140px; object-fit: cover;">

            <div class="card-body p-2 d-flex flex-column">
                <h6 class="mb-1 fw-bold text-truncate" style="font-size: 0.8rem;">{{ produit.nom }}</h6>
                <p class="text-muted mb-2" style="font-size: 0.7rem; line-height: 1.2;">
                    <i class="fas fa-store me-1"></i>{{ produit.boutique.nom|truncatechars:15 }}
                </p>
                
                <div class="d-flex justify-content-between align-items-center mt-auto">
                    <span class="text-primary fw-bold" style="font-size: 0.85rem;">{{ produit.prix|intcomma }} F</span>
                    <a href="{% url 'mplace:detail_market' produit.boutique.slug %}" class="btn btn-sm btn-jago p-1 px-2 rounded-3">
                        <i class="fas fa-eye fa-xs"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <p class="text-muted">Aucun résultat trouvé.</p>
    </div>
    {% endfor %}
</div>

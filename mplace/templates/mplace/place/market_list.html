{% load humanize %}
<div class="row g-3">
 {% for produit in produits %}
    <div class="col-6 col-md-3">
        <div class="card maxit-card h-100 position-relative shadow-sm border-0">
            {% if produit.categorie %}
            <span class="category-badge-overlay" style="font-size: 0.6rem; padding: 2px 6px;">{{ produit.categorie.nom|upper }}</span>
            {% endif %}
             
            <div class="row g-0 align-items-center">
                <div class="col-12">
                    <img src="{% if produit.image %}{{ produit.image.url }}{% else %}https://via.placeholder.com/300/eef4ff/00235B?text={{ produit.name|truncatechars:10 }}{% endif %}" 
                         class="card-img p-2 rounded-4" style="height: 200px; object-fit: cover;">
                </div>

                <div class="col-12">
                    <div class="card-body p-3 d-flex flex-column">
                        <h6 class="mb-1 fw-bold text-truncate" style="font-size: 1rem;">{{ produit.name }}</h6>
                        <p class="text-muted small mb-2"><i class="fas fa-store me-1"></i>{{ produit.boutique.nom }}</p>
                        
                        <div class="d-flex justify-content-between align-items-center mt-auto">
                            <span class="text-primary fw-bold fs-5">{{ produit.selling_price|intcomma }} F</span>
                            <a href="{% url 'mplace:detail_market' produit.boutique.slug %}" class="btn btn-sm btn-jago p-1 px-2 rounded-3">
                                                        <i class="fas fa-eye fa-xs"></i>

                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <p class="text-muted">Aucun résultat trouvé.</p>
    </div>
    {% endfor %}
</div>

<nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom py-2 py-lg-3">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'mplace:home' %}" style="color: #00235B;">
            <i class="fas fa-eye me-2 fs-4"></i>JagoPoint
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#jagoNav">
            <i class="fas fa-bars-staggered" style="color: #00235B;"></i>
        </button>

        <div class="collapse navbar-collapse" id="jagoNav">
            <ul class="navbar-nav ms-auto fw-medium">
                
                <li class="nav-item">
                    <a class="nav-link px-3 {% if request.resolver_match.url_name == 'home' %}active text-primary fw-bold{% endif %}" 
                       href="{% url 'mplace:home' %}">
                        Accueil
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle px-3" href="#" id="catDrop" role="button" data-bs-toggle="dropdown">
                        Catégories
                    </a>
                    <ul class="dropdown-menu border-0 shadow-lg p-2 rounded-4 mt-2">
                        {% for cat in all_categories %}
                            <li>
                                <a class="dropdown-item rounded-3 py-2 {% if request.GET.cat == cat.slug %}bg-primary text-white{% endif %}" 
                                   href="{% url 'mplace:home' %}?cat={{ cat.slug }}">
                                    {{ cat.nom }}
                                </a>
                            </li>
                        {% empty %}
                            <li><span class="dropdown-item disabled text-muted italic">Aucune catégorie</span></li>
                        {% endfor %}
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-3 {% if request.resolver_match.url_name == 'market' or request.resolver_match.url_name == 'detail_market' %}active text-primary fw-bold{% endif %}" 
                       href="{% url 'mplace:market' %}">
                        Marketplace
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-3 {% if request.resolver_match.url_name == 'contact' %}active text-primary fw-bold{% endif %}" 
                       href="{% url 'mplace:contact' %}">
                        Contact
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
